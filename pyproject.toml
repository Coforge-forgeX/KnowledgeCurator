[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kbcurator"
version = "0.1.0"
requires-python = ">=3.10"

# Local-path dependency for zip-based testing.
# Replace with git URL in real usage:
# common-adapters @ git+ssh://git@github.com/YOUR_ORG/common-adapters.git@v1.0.1
dependencies = [
  "common-adapters @ git+https://github.com/Coforge-forgeX/forgexpackages.git@main",
  # "pandas==2.3.3",  # Unused in current service code
  # "pyarrow==24.0.0",  # Unused in current service code
  # "streamlit",  # No streamlit entrypoint in this service

  # MCP server stack
  "fastmcp==3.4.2",
  # "fastapi-mcp==0.4.0",  # No direct usage found in this service
  "uvicorn==0.49.0",
  "mcp[cli]==1.28.1",
  "starlette==1.3.1",

  # Auth & config
  "python-dotenv==1.2.2",
  "PyJWT==2.13.0",
  "passlib[argon2]==1.7.4",
  "argon2-cffi==25.1.0",

  # Database / storage
  "pymongo==4.17.0",
  "psycopg2-binary==2.9.12",
  # "asyncpg>=0.30.0",  # Unused in current service code
  "sqlalchemy==2.0.51",
  "certifi==2026.6.17",

  # AI / LLM
  "openai==2.44.0",
  "langchain==1.3.11",
  # "langchain-community",  # Unused in current service code
  "langchain-openai==1.3.3",
  "langchain-core==1.4.8",
  # "langchain-text-splitters",  # Unused in current service code
  # "langchain-ollama",  # Unused in current service code
  # "langchain-chroma",  # Unused in current service code

  # RAG & knowledge graph
  "lightrag-hku==1.4.16",
  "neo4j==6.2.0",
  # "faiss-cpu>=1.11.0",  # Unused in current service code
  # "sentence-transformers>=5.0.0",  # Unused in current service code
  # "chromadb",  # Unused in current service code

  # Document processing
  "PyMuPDF==1.28.0",
  # "pypdf",  # Not used; service uses PyPDF2
  # "pypdf2==3.0.1",
  "python-docx==1.2.0",
  # "easyocr>=1.7.2",  # Unused in current service code
  # "pytesseract",
  # "paddleocr>=3.3.1",  # Only commented code references
  # "paddlepaddle>=3.2.0",  # Unused in current service code
  # "pdf2image>=1.17.0",  # Unused in current service code
  # "unstructured==0.7.12",  # Unused in current service code
  # "unstructured[pdf]",  # Unused in current service code
  "azure-ai-documentintelligence==1.0.2",

  # Web crawling
  "crawl4ai==0.9.0",
  "aiohttp==3.14.1",

  # Cloud
  "azure-storage-blob==12.30.0",
  # "boto3>=1.28.0",  # Unused in current service code

  # Utilities
  "numpy==2.3.5",
  # "tiktoken",  # Unused in current service code
  "requests==2.34.2",
  # "configparser",  # Standard library module
  # "shiny",  # No shiny app in this service
  # "logging",  # Standard library module
  # "pytest>=8.4.1",  # No tests currently present in repo
  # "ragas>=0.2.15",  # Unused in current service code
  #"datasets==5.0.0",
  # "evaluate>=0.4.4",  # Unused in current service code
  # "pillow>=11.3.0",  # Unused in current service code
  "gunicorn==26.0.0",
  # "nest-asyncio>=1.6.0",  # Unused in current service code
  "msal==1.37.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
kb-server = "kbcurator.server.main:http_app"
