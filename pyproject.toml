[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kb-shared"
version = "0.1.0"
description = "Cross-service adapters and models shared by kb-rest-service and indexer-service"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["shared*"]
