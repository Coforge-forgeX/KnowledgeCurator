[project]
name = "indexer-service"
version = "1.0.0"
description = "Azure WebApp background worker for KB document indexing"
requires-python = ">=3.11"
dependencies = [
    "common-adapters @ git+https://github.com/Coforge-forgeX/forgexpackages.git@main",
    "azure-storage-blob==12.30.0",
    "azure-storage-queue==12.9.0",
    "azure-servicebus==7.12.1",
    "azure-ai-documentintelligence==1.0.2",
    "sqlalchemy==2.0.51",
    "psycopg2-binary==2.9.12",
    "pymongo==4.17.0",
    "certifi==2026.6.17",
    "neo4j==6.2.0",
    "python-dotenv==1.2.2",
    "PyJWT==2.13.0",
    "passlib[argon2]==1.7.4",
    "argon2-cffi==25.1.0",
    "aiohttp==3.14.1",
    "lightrag-hku==1.4.16",
    "crawl4ai==0.9.0",
    "pydantic==2.0.0",
    "pydantic-settings==2.0.0",
    "structlog==24.1.0",
    "python-docx==1.2.0",
    "numpy==2.3.5",
    "requests==2.34.2",
    "gunicorn==26.0.0",
    "msal==1.37.0",
    "pgvector==0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.0",
    "pytest-asyncio==0.21.0",
    "pytest-cov==4.1.0",
    "black==23.3.0",
    "isort==5.12.0",
    "flake8==6.0.0",
    "mypy==1.3.0",
    "bandit==1.7.5",
    "ruff==0.5.0",
]

[build-system]
requires = ["setuptools==68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "azure.*",
    "lightrag.*",
    "crawl4ai.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
# Service root on the path so `src.*` imports resolve the same way they do at runtime.
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--asyncio-mode=auto",
]
asyncio_mode = "auto"

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".venv",
    ".eggs",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]

[tool.ruff]
line-length = 88
target-version = "py311"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
