name: VM Start Test

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
  push:
    branches:
      - development
    paths:
      - '.github/workflows/vmscheduletest.yaml'

jobs:
  start-vm:
    runs-on: ubuntu-latest

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Start VM
        run: |
          az vm start \
            --resource-group forgeXdev \
            --name vmscheduletest

      - name: Verify VM Status
        run: |
          az vm get-instance-view \
            --resource-group forgeXdev \
            --name vmscheduletest \
            --query "instanceView.statuses[?starts_with(code,'PowerState/')].displayStatus" \
            -o tsv
