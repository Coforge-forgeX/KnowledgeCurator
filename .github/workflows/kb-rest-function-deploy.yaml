name: Deploy KB REST Function (DEV)

on:
  workflow_dispatch:
  push:
    branches:
      - V2_dev
    paths:
      - 'kb-rest-service/**'
      - 'shared/**'
      - '.github/workflows/kb-rest-function-deploy.yaml'

env:
  FUNCTION_APP_NAME: forgeX-dev-fun-kb
  SERVICE_DIR: kb-rest-service
  PYTHON_VERSION: '3.11'
  rg_name: ${{ secrets.DEV_RG_NAME }}

jobs:
  deploy-function:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # `shared` is a real package (services/pyproject.toml). Locally it is used
      # via `pip install -e ..`; in the deployed package there is no parent dir,
      # so vendor it at the app root, where Python resolves it normally.
      - name: Vendor shared package
        run: |
          rm -rf "${SERVICE_DIR}/shared"
          cp -r shared "${SERVICE_DIR}/shared"
          find "${SERVICE_DIR}" -name '__pycache__' -type d -prune -exec rm -rf {} +

      - name: Install dependencies
        run: |
          cd "${SERVICE_DIR}"
          python -m pip install --upgrade pip
          pip install -r requirements.txt --target=".python_packages/lib/site-packages"

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.FUNCTION_APP_NAME }}
          package: ${{ env.SERVICE_DIR }}
          scm-do-build-during-deployment: false
          enable-oryx-build: false
