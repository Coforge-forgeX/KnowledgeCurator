name: Feature Request
description: Request a new capability or enhancement for the Knowledge Base platform.
title: "[FEATURE]: "
labels:
  - enhancement

body:
  - type: textarea
    id: summary
    attributes:
      label: Feature Summary
      description: Briefly describe the requested feature.
      placeholder: Describe the feature in one or two sentences.
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem are we trying to solve?
      placeholder: Users cannot filter search results by document source.

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Describe any alternative approaches that were considered.
      placeholder: Any workarounds or alternative solutions.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which KB component does this affect?
      options:
        - KB APIs
        - Indexer
        - Search
        - Integration
        - Database
        - UI
        - Deployment
        - Other

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P1 - Critical
        - P2 - High
        - P3 - Medium
        - P4 - Low
    validations:
      required: true

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance Criteria
      description: Define the conditions for successful completion.
      placeholder: |
        - Users can filter search results by source
        - API supports source filtering
        - Existing functionality remains unaffected

  - type: textarea
    id: business_impact
    attributes:
      label: Business Impact
      description: Describe the expected value or impact.
      placeholder: Improves discoverability and reduces time spent finding relevant content.

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to ensure this feature has not already been requested.
          required: true
