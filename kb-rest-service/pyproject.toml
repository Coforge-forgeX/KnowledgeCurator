[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kb-rest-service"
version = "1.0.0"
description = "Multi-cloud knowledge base REST API service"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "forgeX Architecture Team", email = "kartik.jain@coforge.com"},
]
keywords = ["fastapi", "knowledge-base", "multi-cloud", "azure", "aws", "gcp", "rag"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Framework :: FastAPI",
]

dependencies = [
    # Core framework
    "fastapi==0.136.0",
    "uvicorn[standard]==0.32.0",
    "starlette==0.40.0",
    "gunicorn==26.0.0",

    # Data validation and configuration
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv==1.2.2",
    "typing-extensions>=4.0.0",

    # Database
    "sqlalchemy==2.0.51",
    "asyncpg==0.30.0",
    "psycopg2-binary==2.9.12",
    "pymongo==4.17.0",
    "motor==3.3.0",
    "greenlet==3.1.1",

    # Graph database
    "neo4j==6.2.0",

    # Caching
    "redis==5.0.1",

    # Authentication and security
    "PyJWT[crypto]==2.13.0",
    "passlib[argon2]==1.7.4",
    "argon2-cffi==25.1.0",
    "certifi==2026.6.17",
    "msal==1.37.0",

    # Logging
    "structlog==24.1.0",

    # HTTP clients
    "aiohttp==3.14.1",
    "requests==2.34.2",

    # Cloud providers - Azure (default)
    "azure-functions==1.18.0",
    "azure-storage-blob==12.30.0",
    "azure-storage-queue==12.9.0",
    "azure-servicebus==7.12.1",

    # RAG and AI
    "lightrag-hku==1.4.16",
    "numpy==2.3.5",

    # Internal packages
    "common-adapters @ git+https://github.com/Coforge-forgeX/forgexpackages.git@main",
]

[project.optional-dependencies]
# Development dependencies
dev = [
    "pre-commit",
    "black",
    "isort",
    "flake8",
    "mypy",
    "bandit",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "httpx",
    "faker",
    "types-requests",
]

# Cloud storage providers (multi-cloud support)
# Azure is included in base dependencies by default
aws = [
    "boto3>=1.34.0,<2.0",  # AWS S3 storage
]

gcp = [
    "google-cloud-storage>=2.14.0,<3.0",  # GCP Cloud Storage
]

# Install all cloud providers (Azure + AWS + GCP)
all-clouds = [
    "boto3>=1.34.0,<2.0",
    "google-cloud-storage>=2.14.0,<3.0",
]

[tool.black]
line-length = 88
target-version = ['py38', 'py39', 'py310', 'py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | __pycache__
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
src_paths = ["src", "tests"]
known_first_party = ["core", "common", "shared", "functions", "services", "helpers", "models"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
ignore_missing_imports = true
strict_optional = false

[[tool.mypy.overrides]]
module = "azure.functions.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
# 7.0+ required for the `pythonpath` option below.
minversion = "7.0"
# Service root on the path so `src.*` imports resolve the same way they do at runtime.
pythonpath = ["."]
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.flake8]
max-line-length = 88
extend-ignore = ["E203", "W503", "E501"]
per-file-ignores = [
    "__init__.py:F401",
    "tests/*:S101",
]
exclude = [
    ".git",
    "__pycache__",
    ".venv",
    ".eggs",
    "*.egg",
    "build",
    "dist",
]

[tool.bandit]
exclude_dirs = ["tests", ".venv", "__pycache__"]
skips = ["B101", "B601"]

[tool.pyright]
include = ["src", "main.py"]
extraPaths = ["src"]
pythonVersion = "3.11"
typeCheckingMode = "basic"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
