version: '3.8'

services:
  kb-rest-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kb-rest-service
    ports:
      - "8081:8080"
    environment:
      # Application
      PORT: 8080
      DEBUG: "true"
      ENVIRONMENT: development
      CLOUD_PROVIDER: local

      # Database
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@host.docker.internal:5432/forgex_kb}

      # MongoDB
      MONGODB_URI: ${MONGODB_URI:-mongodb://host.docker.internal:27017/forgex_kb}

      # Neo4j
      NEO4J_URI: ${NEO4J_URI:-bolt://host.docker.internal:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}

      # Redis
      REDIS_URL: ${REDIS_URL:-redis://host.docker.internal:6379/0}

      # Azure Storage (for local dev with Azurite)
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://host.docker.internal:10000/devstoreaccount1;QueueEndpoint=http://host.docker.internal:10001/devstoreaccount1;}

      # JWT
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 60

      # CORS
      CORS_ORIGINS: "*"

    volumes:
      - ./src:/app/src
    networks:
      - kb-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  kb-network:
    name: kb-network
    driver: bridge
